[package]
name = "opencam-core"
version = "0.1.0"
edition = "2021"
description = "Núcleo compartido de OpenCam: protocolo OPCM, cola de frames y métricas"
license = "MIT"

[dependencies]
aes-gcm = "0.10"
getrandom = "0.2"
hkdf = "0.12"
hmac = "0.12"
p256 = { version = "0.13", default-features = false, features = ["ecdh", "std"] }
sha2 = "0.10"

[lib]
name = "opencam_core"
path = "src/lib.rs"
