name: CI

# Comprueba que el repo compila en cada push a main y en los PR, sin publicar
# nada y sin necesitar secretos (la APK de debug no se firma).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (core y escritorio)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            core -> target
            desktop -> target
            desktop/windows-vcam -> target
      - name: Tests del núcleo
        working-directory: core
        shell: bash
        run: cargo test --locked
      - name: Tests del cliente de escritorio
        working-directory: desktop
        shell: bash
        run: cargo test --locked
      - name: Formato (núcleo y escritorio)
        # Aviso por ahora; quitar continue-on-error cuando el código esté formateado.
        continue-on-error: true
        shell: bash
        run: |
          (cd core && cargo fmt --check)
          (cd desktop && cargo fmt --check)
      - name: Clippy (núcleo y escritorio)
        # Aviso por ahora (sin -D warnings); quitar continue-on-error al limpiar avisos.
        continue-on-error: true
        shell: bash
        run: |
          (cd core && cargo clippy --locked)
          (cd desktop && cargo clippy --locked)
      - name: Compilar cliente de escritorio (Linux)
        working-directory: desktop
        shell: bash
        run: cargo build --locked
      - name: Type-check del filtro DirectShow
        # Target Windows: valida el código de la cámara virtual sin compilar C.
        shell: bash
        run: |
          rustup target add x86_64-pc-windows-gnu
          cd desktop/windows-vcam
          cargo check --target x86_64-pc-windows-gnu --locked

  android:
    name: Android (APK de debug)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Compilar APK de debug
        working-directory: android
        shell: bash
        run: ./gradlew :app:assembleDebug --no-daemon
      - name: Tests unitarios de debug
        working-directory: android
        shell: bash
        run: ./gradlew :app:testDebugUnitTest --no-daemon

  installer:
    name: Instalador de Windows (sintaxis)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar NSIS
        shell: bash
        run: sudo apt-get update -qq && sudo apt-get install -y -qq nsis
      - name: Compilar con piezas de mentira
        # Sólo comprueba que el script NSIS es válido; los binarios reales los
        # pone el workflow de release antes de compilarlo.
        working-directory: desktop/windows-installer
        shell: bash
        run: |
          mkdir -p payload
          printf 'MZ' > payload/opencam-desktop.exe
          printf 'MZ' > payload/opencam_vcam.dll
          makensis -DVERSION=0.0.0-test -DOUTDIR=. opencam.nsi
          test -f opencam-setup-windows-x86_64.exe

  ios:
    name: iOS (compilación del simulador)
    # macos-15 trae Xcode 16, que abre el formato de proyecto que genera xcodegen.
    continue-on-error: true
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Instalar XcodeGen
        run: brew install xcodegen
      - name: Generar proyecto y compilar para simulador
        working-directory: ios
        shell: bash
        run: |
          xcodegen
          xcodebuild -scheme OpenCam -sdk iphonesimulator CODE_SIGNING_ALLOWED=NO build

