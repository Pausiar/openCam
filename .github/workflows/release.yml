name: Build and release

# Se ejecuta al subir un tag v* (publica la release) o a mano (sólo compila
# y deja los artefactos en la pestaña del workflow).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-desktop:
    name: Cliente de escritorio (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - name: Compilar
        working-directory: desktop
        shell: bash
        run: cargo build --release --locked
      - name: Preparar artefacto
        shell: bash
        run: cp desktop/target/release/opencam-desktop opencam-desktop-linux-x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: opencam-desktop-linux-x86_64
          path: opencam-desktop-linux-x86_64
          if-no-files-found: error

  windows-desktop:
    name: Cliente de escritorio (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - name: Compilar
        working-directory: desktop
        shell: bash
        run: cargo build --release --locked
      - name: Preparar artefacto
        shell: bash
        run: cp desktop/target/release/opencam-desktop.exe opencam-desktop-windows-x86_64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: opencam-desktop-windows-x86_64
          path: opencam-desktop-windows-x86_64.exe
          if-no-files-found: error

  windows-vcam:
    name: Cámara virtual DirectShow (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/windows-vcam
      - name: Compilar
        working-directory: desktop/windows-vcam
        shell: bash
        run: cargo build --release
      - name: Preparar artefacto
        shell: bash
        run: cp desktop/windows-vcam/target/release/opencam_vcam.dll opencam-vcam-windows-x86_64.dll
      - uses: actions/upload-artifact@v4
        with:
          name: opencam-vcam-windows-x86_64
          path: opencam-vcam-windows-x86_64.dll
          if-no-files-found: error

  android:
    name: App Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      # Sin proyecto de firma en el repo, la APK de depuración es la única
      # instalable directamente (va firmada con la clave de depuración).
      - name: Compilar APK
        working-directory: android
        shell: bash
        run: gradle :app:assembleDebug --no-daemon
      - name: Preparar artefacto
        shell: bash
        run: cp android/app/build/outputs/apk/debug/app-debug.apk opencam-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: opencam-android
          path: opencam-android.apk
          if-no-files-found: error

  release:
    name: Publicar release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux-desktop, windows-desktop, windows-vcam, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Crear o actualizar la release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "OpenCam $TAG" --generate-notes
          fi
          gh release upload "$TAG" dist/* --clobber
