name: Build and release

# Se ejecuta al subir un tag v* (publica la release) o a mano (sólo compila
# y deja los artefactos en la pestaña del workflow).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux-desktop:
    name: Cliente de escritorio (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - name: Compilar
        working-directory: desktop
        shell: bash
        env:
          # Versión que muestra la ventana (vacía al lanzarlo a mano: usa la de Cargo.toml).
          OPENCAM_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: cargo build --release --locked
      - name: Preparar artefacto
        shell: bash
        run: cp desktop/target/release/opencam-desktop opencam-desktop-linux-x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: opencam-desktop-linux-x86_64
          path: opencam-desktop-linux-x86_64
          if-no-files-found: error

  windows-desktop:
    name: Cliente de escritorio (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - name: Compilar
        working-directory: desktop
        shell: bash
        env:
          # Versión que muestra la ventana (vacía al lanzarlo a mano: usa la de Cargo.toml).
          OPENCAM_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: cargo build --release --locked
      - name: Preparar artefacto
        shell: bash
        run: cp desktop/target/release/opencam-desktop.exe opencam-desktop-windows-x86_64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: opencam-desktop-windows-x86_64
          path: opencam-desktop-windows-x86_64.exe
          if-no-files-found: error

  windows-vcam:
    name: Cámara virtual DirectShow (Windows, 64 y 32 bits)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          # Las apps de 32 bits (algunas instalaciones de Discord, apps antiguas) sólo
          # cargan una DLL de 32 bits.
          targets: x86_64-pc-windows-msvc, i686-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/windows-vcam
      - name: Compilar
        working-directory: desktop/windows-vcam
        shell: bash
        run: |
          cargo build --release --locked --target x86_64-pc-windows-msvc
          cargo build --release --locked --target i686-pc-windows-msvc
      - name: Probar el registro en Windows
        # El runner es administrador: registra las dos DLL, comprueba el registro y que
        # DirectShow lista la cámara, y las desregistra.
        working-directory: desktop/windows-vcam
        shell: pwsh
        run: |
          ./test-register.ps1 `
            -Dll64 target/x86_64-pc-windows-msvc/release/opencam_vcam.dll `
            -Dll32 target/i686-pc-windows-msvc/release/opencam_vcam.dll
      - name: Preparar artefactos
        shell: bash
        run: |
          cp desktop/windows-vcam/target/x86_64-pc-windows-msvc/release/opencam_vcam.dll opencam-vcam-windows-x86_64.dll
          cp desktop/windows-vcam/target/i686-pc-windows-msvc/release/opencam_vcam.dll opencam-vcam-windows-x86.dll
      - uses: actions/upload-artifact@v4
        with:
          name: opencam-vcam-windows-x86_64
          path: opencam-vcam-windows-x86_64.dll
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: opencam-vcam-windows-x86
          path: opencam-vcam-windows-x86.dll
          if-no-files-found: error

  windows-installer:
    name: Instalador (Windows)
    needs: [windows-desktop, windows-vcam]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # El instalador empaqueta las dos piezas ya compiladas.
      - uses: actions/download-artifact@v4
        with:
          name: opencam-desktop-windows-x86_64
          path: desktop/windows-installer/payload
      - uses: actions/download-artifact@v4
        with:
          name: opencam-vcam-windows-x86_64
          path: desktop/windows-installer/payload
      - uses: actions/download-artifact@v4
        with:
          name: opencam-vcam-windows-x86
          path: desktop/windows-installer/payload
      - name: Renombrar las piezas
        working-directory: desktop/windows-installer/payload
        shell: bash
        run: |
          mv opencam-desktop-windows-x86_64.exe opencam-desktop.exe
          mv opencam-vcam-windows-x86_64.dll opencam_vcam.dll
          mv opencam-vcam-windows-x86.dll opencam_vcam_x86.dll
      - name: Instalar NSIS
        shell: pwsh
        run: choco install nsis --no-progress -y
      - name: Compilar el instalador
        working-directory: desktop/windows-installer
        shell: pwsh
        run: |
          $makensis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (-not (Test-Path $makensis)) { $makensis = "makensis" }
          # En un tag la versión es el propio tag (v0.1.2 -> 0.1.2).
          if ($env:GITHUB_REF -like 'refs/tags/v*') { $v = $env:GITHUB_REF_NAME.Substring(1) } else { $v = "0.1.0" }
          & $makensis "/DVERSION=$v" "/DOUTDIR=$PWD" opencam.nsi
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        with:
          name: opencam-setup-windows-x86_64
          path: desktop/windows-installer/opencam-setup-windows-x86_64.exe
          if-no-files-found: error

  macos-desktop:
    # Sin cámara virtual en macOS: sólo salida Y4M (no hay filtro de cámara).
    name: Cliente de escritorio (macOS, sin cámara virtual; sólo salida Y4M)
    # Runner Apple Silicon: el binario es arm64 (no corre en Macs Intel).
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - name: Compilar
        working-directory: desktop
        shell: bash
        env:
          # Versión que muestra la ventana (vacía al lanzarlo a mano: usa la de Cargo.toml).
          OPENCAM_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: cargo build --release --locked
      - name: Preparar artefacto
        shell: bash
        run: cp desktop/target/release/opencam-desktop opencam-desktop-macos-arm64-sin-camara-virtual-solo-y4m
      - uses: actions/upload-artifact@v4
        with:
          name: opencam-desktop-macos-arm64-sin-camara-virtual-solo-y4m
          path: opencam-desktop-macos-arm64-sin-camara-virtual-solo-y4m
          if-no-files-found: error

  android:
    name: App Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # La keystore vive en secretos de GitHub (base64 del .p12 y contraseñas).
      - name: Preparar firma
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Faltan secretos de firma de Android: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD."
            exit 1
          fi
          mkdir -p android/keystore
          # Tolera espacios, saltos de línea, comillas y un prefijo NOMBRE= pegado por error.
          printf '%s' "$KEYSTORE_B64" | sed -E 's/^[A-Z0-9_]+=//' | tr -d '[:space:]"' | base64 -d > android/keystore/opencam-release.p12
          printf 'storeFile=keystore/opencam-release.p12\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > android/keystore.properties
      - name: Compilar APK firmada
        working-directory: android
        shell: bash
        run: |
          # En un tag la versión es el propio tag (v0.1.2 -> 0.1.2); a mano, la de por defecto.
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.1.0"
          fi
          ./gradlew :app:assembleRelease --no-daemon \
            -PappVersionName="$VERSION" \
            -PappVersionCode="${{ github.run_number }}"
      - name: Preparar artefacto
        shell: bash
        run: cp android/app/build/outputs/apk/release/app-release.apk opencam-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: opencam-android
          path: opencam-android.apk
          if-no-files-found: error

  release:
    name: Publicar release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux-desktop, windows-desktop, windows-vcam, windows-installer, macos-desktop, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Solo hace falta docs/releases/ (las notas de cada versión).
      - uses: actions/checkout@v4
        with:
          sparse-checkout: docs/releases
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Sumas SHA-256
        # Permite comprobar que la descarga no se corrompió ni se manipuló: sha256sum -c SHA256SUMS
        shell: bash
        run: cd dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS
      - name: Crear o actualizar la release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Si hay notas escritas para esta versión (docs/releases/<tag>.md) sustituyen a la
          # lista automática de PR, también si la release ya se creó desde la web de GitHub.
          notes="docs/releases/$TAG.md"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            if [ -f "$notes" ]; then
              gh release create "$TAG" --title "OpenCam $TAG" --notes-file "$notes"
            else
              gh release create "$TAG" --title "OpenCam $TAG" --generate-notes
            fi
          elif [ -f "$notes" ]; then
            gh release edit "$TAG" --title "OpenCam $TAG" --notes-file "$notes"
          fi
          gh release upload "$TAG" dist/* --clobber
