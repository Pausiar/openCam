[package]
name = "opencam-desktop"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Cliente de escritorio de OpenCam: recibe OPCM y alimenta una cámara virtual"

[dependencies]
mdns-sd = "0.21.7"
opencam-core = { path = "../core" }
openh264 = "0.9.9"
plist = "1.10.3"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2.191"

# `CreateFileMappingW` (memoria compartida de la cámara virtual) exige Win32_Security.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Memory"] }
