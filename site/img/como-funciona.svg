<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 200" role="img" aria-labelledby="t d" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="t">Cómo funciona OpenCam</title>
  <desc id="d">El móvil captura y codifica H.264, lo envía por USB o Wi-Fi al ordenador, y el cliente de escritorio lo publica como cámara virtual para Zoom, Meet, OBS o Teams.</desc>
  <style>
    .box { fill: #ffffff; stroke: #d8d3c6; stroke-width: 1.5; }
    .hl { fill: #1d5e4b; }
    .t { fill: #1c1b18; font-size: 15px; font-weight: 600; }
    .s { fill: #5c5950; font-size: 12px; }
    .a { stroke: #1d5e4b; stroke-width: 2; fill: none; }
    .al { fill: #1d5e4b; font-size: 12px; font-weight: 600; }
    @media (prefers-color-scheme: dark) {
      .box { fill: #1c1b18; stroke: #3a3830; }
      .hl { fill: #7fcaa9; }
      .t { fill: #ece9e1; }
      .s { fill: #aaa69a; }
      .a { stroke: #7fcaa9; }
      .al { fill: #7fcaa9; }
    }
  </style>
  <defs>
    <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="hl"/>
    </marker>
  </defs>

  <rect class="box" x="10" y="30" width="200" height="140" rx="14"/>
  <rect class="hl" x="10" y="30" width="6" height="140" rx="3"/>
  <text class="t" x="32" y="62">Móvil</text>
  <text class="s" x="32" y="88">Android o iPhone</text>
  <text class="s" x="32" y="108">Captura la cámara</text>
  <text class="s" x="32" y="128">Codifica H.264</text>
  <text class="s" x="32" y="148">por hardware</text>

  <path class="a" d="M214,100 L326,100" marker-end="url(#m)"/>
  <text class="al" x="270" y="88" text-anchor="middle">USB o Wi-Fi</text>
  <text class="s" x="270" y="122" text-anchor="middle">puerto 4747</text>

  <rect class="box" x="330" y="30" width="200" height="140" rx="14"/>
  <rect class="hl" x="330" y="30" width="6" height="140" rx="3"/>
  <text class="t" x="352" y="62">Ordenador</text>
  <text class="s" x="352" y="88">Cliente OpenCam</text>
  <text class="s" x="352" y="108">Decodifica el vídeo</text>
  <text class="s" x="352" y="128">Resolución, fps y</text>
  <text class="s" x="352" y="148">bitrate a tu gusto</text>

  <path class="a" d="M534,100 L626,100" marker-end="url(#m)"/>
  <text class="al" x="580" y="88" text-anchor="middle">cámara</text>
  <text class="al" x="580" y="122" text-anchor="middle">virtual</text>

  <rect class="box" x="630" y="30" width="120" height="140" rx="14"/>
  <text class="t" x="690" y="62" text-anchor="middle">Tus apps</text>
  <text class="s" x="690" y="92" text-anchor="middle">Zoom</text>
  <text class="s" x="690" y="112" text-anchor="middle">Meet</text>
  <text class="s" x="690" y="132" text-anchor="middle">OBS</text>
  <text class="s" x="690" y="152" text-anchor="middle">Teams</text>
</svg>
